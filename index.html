<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Desarrollador web en Madrid. Portfolio de proyectos relacionados con desarrollo web, e-commerce y aplicaciones."
    />
    <meta property="og:title" content="Luis Montes de Oca | Desarrollador Web" />
    <meta
      property="og:description"
      content="Desarrollador web en Madrid. Portfolio de proyectos relacionados con desarrollo web, e-commerce y aplicaciones."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06090f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef3f9" />
    <title>Luis Montes de Oca | Desarrollador Web</title>
    <script>
      // Aplica el tema guardado (o el del sistema) antes del primer pintado
      ;(function () {
        try {
          var stored = localStorage.getItem('lm-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
